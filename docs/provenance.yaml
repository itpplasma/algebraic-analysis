package: itpplasma/algebraic-analysis
provenance_policy: >-
  Repository names, source paths, and consumer mappings below are historical
  provenance records preserving the source of each declaration; they do not
  assert current repository visibility or an active downstream location.
policy: >-
  Each extracted declaration has one authoritative home in this package.
  Downstream repositories may retain import-only compatibility modules during
  a migration, but never a second declaration.


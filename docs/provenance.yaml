schema_version: 1
package: itpplasma/algebraic-analysis
status: private-pre-release
policy: >-
  Each extracted declaration has one authoritative home in this package.
  Downstream repositories may retain import-only compatibility modules during
  a migration, but never a second declaration.

extractions:
  - id: ore-right-division
    source_repository: itpplasma/stafford38
    source_revision: 25dc12ccaba6ad1ff74db7f9be813fb64fb10782
    source_path: proofs/ore_right_division.lean
    target_path: AlgebraicAnalysis/Ore/RightDivision.lean
    target_namespace: AlgebraicAnalysis.OreDivision
    declaration_scope: all declarations in the source file under Stafford
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Stafford38
    consumers:
      - itpplasma/stafford38
      - plasma/proj/bjork
    notes: >-
      The package file is a namespace-neutral extraction.  The source also
      contains a generic faithful ambient and reverse-multiplication layer;
      no presented Weyl theorem is imported by this module.

  - id: ore-associativity
    source_repository: itpplasma/stafford38
    source_revision: 25dc12ccaba6ad1ff74db7f9be813fb64fb10782
    source_path: Stafford38/Ore/Associativity.lean
    target_path: AlgebraicAnalysis/Ore/Associativity.lean
    target_namespace: AlgebraicAnalysis.OreAssociativity
    declaration_scope: all declarations in the source file under Stafford38.OreAssociativity
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Stafford38
    consumers:
      - itpplasma/stafford38
      - plasma/proj/bjork
    depends_on: [ore-right-division]

  - id: ore-right-quotient
    source_repository: itpplasma/stafford38
    source_revision: 25dc12ccaba6ad1ff74db7f9be813fb64fb10782
    source_path: Stafford38/Ore/RightQuotient.lean
    source_section: generic pre-ConcreteWeyl section
    target_path: AlgebraicAnalysis/Ore/RightQuotient.lean
    target_namespace: AlgebraicAnalysis.OreRightQuotient
    declaration_scope: all declarations in the extracted generic section
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Stafford38
    consumers:
      - itpplasma/stafford38
      - plasma/proj/bjork
    depends_on: [ore-right-division, ore-associativity]
    notes: >-
      The concrete iterated-Weyl section remains in Stafford38.  The package
      owns only the opposite-module, finite-window, and two-generator quotient
      interfaces.

  - id: ore-right-hilbert-basis
    source_repository: itpplasma/stafford38
    source_revision: 25dc12ccaba6ad1ff74db7f9be813fb64fb10782
    source_path: Stafford38/Ore/DerivationOreRightHilbertBasis.lean
    target_path: AlgebraicAnalysis/Ore/RightHilbertBasis.lean
    target_namespace: AlgebraicAnalysis.OreDerivationRightHilbertBasis
    declaration_scope: all generic declarations; concrete iterated-Weyl closure excluded
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Stafford38
    consumers:
      - itpplasma/stafford38
      - plasma/proj/bjork
    depends_on: [ore-right-division, ore-associativity, ore-right-quotient]

  - id: ore-left-pbw
    source_repository: plasma/proj/bjork
    source_revision: 414131fa8173e3622667dc0ae19ad9a197a88a99
    source_path: Bjork/OrePBW.lean
    target_path: AlgebraicAnalysis/Ore/LeftPBW.lean
    target_namespace: AlgebraicAnalysis.OreLeftPBW
    declaration_scope: all generic left PBW declarations in the source file
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Bjork
    consumers:
      - plasma/proj/bjork
      - itpplasma/stafford38
    depends_on: [ore-associativity]
    notes: >-
      The package module changes only the namespace and import path.  It owns
      the left normal-form basis, not any application-specific tower theorem.

  - id: ore-right-pbw
    source_repository: plasma/proj/bjork
    source_revision: 414131fa8173e3622667dc0ae19ad9a197a88a99
    source_path: Bjork/RightOrePBW.lean
    target_path: AlgebraicAnalysis/Ore/RightPBW.lean
    target_namespace: AlgebraicAnalysis.OreRightPBW
    declaration_scope: all generic right PBW declarations in the source file
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Bjork
    consumers:
      - plasma/proj/bjork
      - itpplasma/stafford38
    depends_on: [ore-right-hilbert-basis]
    notes: >-
      Right-module orientation is retained explicitly; no left/right
      identification is introduced by the extraction.

  - id: ore-commuting-lift
    source_repository: plasma/proj/bjork
    source_revision: 414131fa8173e3622667dc0ae19ad9a197a88a99
    source_path: Bjork/OreTower.lean
    target_path: AlgebraicAnalysis/Ore/Tower.lean
    target_namespace: AlgebraicAnalysis.OreTower
    declaration_scope: all generic coefficientwise commuting-lift declarations
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Bjork
    consumers:
      - plasma/proj/bjork
    depends_on: [ore-left-pbw]

  - id: ore-iterated-tower
    source_repository: plasma/proj/bjork
    source_revision: 414131fa8173e3622667dc0ae19ad9a197a88a99
    source_path: Bjork/IteratedOreTower.lean
    target_path: AlgebraicAnalysis/Ore/IteratedTower.lean
    target_namespace: AlgebraicAnalysis.OreIteratedTower
    declaration_scope: all generic finite commuting derivation-Ore tower declarations
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Bjork
    consumers:
      - plasma/proj/bjork
    depends_on: [ore-commuting-lift]

  - id: ore-iterated-pbw
    source_repository: plasma/proj/bjork
    source_revision: 414131fa8173e3622667dc0ae19ad9a197a88a99
    source_path: Bjork/IteratedPBW.lean
    target_path: AlgebraicAnalysis/Ore/IteratedPBW.lean
    target_namespace: AlgebraicAnalysis.OreIteratedPBW
    declaration_scope: all generic field-linear PBW declarations for finite towers
    license: Apache-2.0
    authorship: inherited repository contribution; preserve source history in Bjork
    consumers:
      - plasma/proj/bjork
    depends_on: [ore-iterated-tower]

name = "algebraicAnalysis"
version = "0.3.3"
defaultTargets = ["AlgebraicAnalysis"]
reservoir = false
lintDriver = "batteries/runLinter"
testDriver = "AlgebraicAnalysisTest"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "AlgebraicAnalysis"

[[lean_lib]]
name = "AlgebraicAnalysisHessian"
roots = [
  "AlgebraicAnalysis.HessianAlgebra.AffineInverse",
  "AlgebraicAnalysis.HessianAlgebra.ConstantHessian",
  "AlgebraicAnalysis.HessianAlgebra.CoordinateChange",
  "AlgebraicAnalysis.HessianAlgebra.DerivativeKernel",
  "AlgebraicAnalysis.HessianAlgebra.HessianCoordinateChange",
  "AlgebraicAnalysis.HessianAlgebra.HomogeneousDifferential",
  "AlgebraicAnalysis.HessianAlgebra.HomogeneousSubstitution",
  "AlgebraicAnalysis.HessianAlgebra.HomogeneousSupport",
  "AlgebraicAnalysis.HessianAlgebra.PolynomialMap",
  "AlgebraicAnalysis.HessianAlgebra.TriangularInverse",
]

[[lean_lib]]
name = "AlgebraicAnalysisTest"
